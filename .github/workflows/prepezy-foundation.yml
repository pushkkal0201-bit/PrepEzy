name: PrepEzy adaptive foundation
on:
  push:
    paths:
      - 'platform/**'
      - '.github/workflows/prepezy-foundation.yml'
  pull_request:
    paths:
      - 'platform/**'
      - '.github/workflows/prepezy-foundation.yml'
jobs:
  api-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
